name: Validate JK TRADES
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/marketplace-backend-schema]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Validate PWA manifest
        run: python -m json.tool manifest.webmanifest > /dev/null
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inline = []
                  self.current = None
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.current = [] if not attrs.get("src") else None
              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.inline.append("".join(self.current))
                      self.current = None
          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          if not parser.inline:
              raise SystemExit("No inline JavaScript found")
          for i, source in enumerate(parser.inline, 1):
              Path(f"/tmp/jk-inline-{i}.js").write_text(source, encoding="utf-8")
          print(f"Extracted {len(parser.inline)} inline script(s)")
          PY
          for file in /tmp/jk-inline-*.js; do node --check "$file"; done
      - name: Check service worker JavaScript syntax
        run: node --check sw.js
